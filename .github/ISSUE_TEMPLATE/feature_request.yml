name: Feature request
description: Suggest a new Canvas workflow, tool, or integration improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Describe the workflow that is currently difficult or impossible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      placeholder: What should canvas-mcp do?
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Relevant write mode
      options:
        - read_only
        - student
        - teacher
        - full
        - All modes
        - Not sure

  - type: textarea
    id: api
    attributes:
      label: Canvas API context
      description: If you know the relevant Canvas endpoint, include it here.
      placeholder: /api/v1/...

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request does not contain real student records or credentials.
          required: true
